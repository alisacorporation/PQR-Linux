[package]
name = "pqr-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
# No rust-version: modern eframe/egui needs a newer toolchain than the
# workspace MSRV 1.75 (declared per-package, so this does not affect the
# other crates).

[[bin]]
name = "pqr-gui"
path = "src/main.rs"

[dependencies]
pqr-profile = { path = "../pqr-profile" }
anyhow = { workspace = true }
clap = { workspace = true }
# X11-only (no wayland): under KDE/Wayland the Wayland backend ignores
# with_position, so the window can't be pinned to the second monitor next to
# the game. XWayland honors positions and keeps xdotool/screenshot tooling
# working. glow renderer: lighter than the default wgpu for a utility window.
eframe = { version = "0.36.2", default-features = false, features = [
    "glow",
    "default_fonts",
    "links",
    "x11",
] }
