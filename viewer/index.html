<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PQR Profile Compare</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1 class="brand">PQR <span data-i18n="brandSuffix">Сравнение профилей</span></h1>
      <div class="lang-toggle" role="group" aria-label="language">
        <button type="button" id="lang-ru" class="lang-btn">RU</button>
        <button type="button" id="lang-en" class="lang-btn">EN</button>
      </div>
    </div>

    <div class="topbar-row controls">
      <label class="field">
        <span data-i18n="class">Класс</span>
        <select id="sel-class"></select>
      </label>

      <label class="field grow">
        <span data-i18n="profileA">Профиль A</span>
        <select id="sel-a"></select>
      </label>

      <button type="button" id="btn-swap" class="swap" title="A ⇄ B">⇄</button>

      <label class="field grow">
        <span data-i18n="profileB">Профиль B</span>
        <select id="sel-b"></select>
      </label>
    </div>

    <div class="topbar-row options">
      <label class="field">
        <span data-i18n="sortBy">Сортировка</span>
        <select id="sel-sort">
          <option value="order-a" data-i18n="sortOrderA">Порядок A</option>
          <option value="order-b" data-i18n="sortOrderB">Порядок B</option>
          <option value="alpha" data-i18n="sortAlpha">Алфавит</option>
          <option value="delta" data-i18n="sortDelta">Расхождения первыми</option>
        </select>
      </label>

      <label class="check">
        <input type="checkbox" id="chk-diff">
        <span data-i18n="onlyDiff">Только различия</span>
      </label>

      <label class="check">
        <input type="checkbox" id="chk-sections">
        <span data-i18n="showSections">Показать секции</span>
      </label>

      <div class="view-toggle" role="group" aria-label="view">
        <button type="button" id="view-merge" class="view-btn" data-view="merge" data-i18n="viewMerge">Склейка</button>
        <button type="button" id="view-cols" class="view-btn" data-view="cols" data-i18n="viewCols">Две колонки</button>
      </div>
    </div>
  </header>

  <section id="stats" class="stats" hidden></section>

  <section class="legend" id="legend">
    <span class="lg lg-both"><i></i><span data-i18n="legendBoth">в обоих</span></span>
    <span class="lg lg-a"><i></i><span data-i18n="legendOnlyA">только в A</span></span>
    <span class="lg lg-b"><i></i><span data-i18n="legendOnlyB">только в B</span></span>
    <span class="lg lg-delta"><i></i><span data-i18n="legendDelta">↑ раньше в B · ↓ позже в B</span></span>
  </section>

  <section id="notes" class="notes"></section>

  <main id="main">
    <div id="status" class="status"></div>
    <div id="diff" class="diff" hidden></div>
  </main>

  <footer class="footer">
    <span data-i18n="footer">Данные читаются напрямую из PQR_fixed/Profiles/*.xml. Запуск: python3 -m http.server из корня репозитория.</span>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/parse.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
